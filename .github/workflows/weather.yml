name: 毎朝の天気更新

on:
  schedule:
    - cron: '45 20 * * *' # 毎日 05:45 (日本時間)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/update-weather.js
      - name: 変更があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || git commit -m "天気を更新 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
          git push
