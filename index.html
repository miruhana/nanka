<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>なんか。</title>
<meta name="description" content="服薬・睡眠・肌・頭痛をまとめて記録する、個人用の肌管理アプリ">
<meta name="theme-color" content="#F1F4EF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151B18" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one phone-width column. Greeting header on top, five panels switched by a fixed bottom tab bar.
   Headache outlook leads the home panel because it is the thing to act on first. */
:root{
  color-scheme:light dark;
  --bg:#F1F4EF; --surface:#FFFFFF; --surface2:#E4EBE1; --ink:#26302B; --muted:#62716A; --line:#D5DFD3;
  --accent:#4F7A64; --accent-ink:#FFFFFF; --accent-soft:#DDEADF;
  --ok:#2F5F7E; --ok-soft:#DCEAF2; --warn:#85560A; --warn-soft:#F8EBCB; --alert:#A33533; --alert-soft:#F8DAD8;
  --shadow:0 8px 24px rgba(55,90,72,.12);
  --f-display:'Zen Maru Gothic','Hiragino Maru Gothic ProN','Yu Gothic',sans-serif;
  --f-body:'Zen Kaku Gothic New','Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#151B18; --surface:#1F2823; --surface2:#2A352F; --ink:#E8EFEA; --muted:#A3B2A9; --line:#34423A;
  --accent:#8DBBA2; --accent-ink:#14201A; --accent-soft:#2B3E33;
  --ok:#8FBBD6; --ok-soft:#1F3340; --warn:#E8BB66; --warn-soft:#403219; --alert:#F29692; --alert-soft:#4B2624;
  --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151B18; --surface:#1F2823; --surface2:#2A352F; --ink:#E8EFEA; --muted:#A3B2A9; --line:#34423A;
  --accent:#8DBBA2; --accent-ink:#14201A; --accent-soft:#2B3E33;
  --ok:#8FBBD6; --ok-soft:#1F3340; --warn:#E8BB66; --warn-soft:#403219; --alert:#F29692; --alert-soft:#4B2624;
  --shadow:0 8px 24px rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-inline:16px;padding-block:0 104px}
#app{max-width:480px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.35}
p{margin:0}
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;padding-bottom:10px}
.top>div:first-child{padding-top:14px}
.top .date{font-size:12px;color:var(--muted);letter-spacing:.06em}
.top h1{font-size:22px;font-weight:700}
.brand{font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--accent);
  background:var(--accent-soft);padding:4px 12px;border-radius:999px;white-space:nowrap}
main{display:flex;flex-direction:column;gap:16px;padding-top:6px}
section.panel{display:flex;flex-direction:column;gap:16px;min-width:0}

.card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;min-width:0}
.card.lift{box-shadow:var(--shadow);border-color:transparent}
.card h2{font-size:17px}
.card h3{font-size:15px}
.sub{font-size:12px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}

.btn{border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;border-radius:999px;
  padding:12px 20px;min-height:46px;cursor:pointer;font-family:var(--f-display)}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--accent)}
.btn.soft{background:var(--accent-soft);color:var(--accent)}
.btn.small{min-height:36px;padding:6px 14px;font-size:13px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:6px}
.link.danger{color:var(--alert)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;min-height:38px;
  cursor:pointer;font-size:14px}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.seg .chip{padding-inline:0;text-align:center;border-radius:14px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;color:var(--muted);letter-spacing:.04em}
input[type=text],input[type=password],input[type=time],input[type=number],select,textarea{width:100%;min-width:0;background:var(--bg);
  border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;min-height:44px}
textarea{resize:vertical;min-height:76px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:340px){.two{grid-template-columns:1fr}}

.lv{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;border-radius:999px;padding:3px 12px 3px 9px;white-space:nowrap;align-self:flex-start}
.lv i{width:10px;height:10px;background:currentColor;display:inline-block}
.lv-ok{background:var(--ok-soft);color:var(--ok)} .lv-ok i{border-radius:50%}
.lv-warn{background:var(--warn-soft);color:var(--warn)} .lv-warn i{clip-path:polygon(50% 0,100% 100%,0 100%)}
.lv-alert{background:var(--alert-soft);color:var(--alert)} .lv-alert i{clip-path:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.sample,.tag.stale{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--ok-soft);color:var(--ok)}

.outlook{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.outlook>div{background:var(--bg);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.outlook .when{font-size:12px;color:var(--muted)}
.reasons{margin:0;padding-left:1.1em;font-size:13px;color:var(--ink)}
.pills{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pills .chip{white-space:nowrap;min-height:34px;font-size:13px;padding:4px 12px}
.tip{font-size:14px;background:var(--accent-soft);border-radius:14px;padding:10px 12px}

.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile.wide{grid-column:1/-1}
.tile .big{font-size:26px;line-height:1.2}
.tile button{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:2px;width:100%}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:6px}
.bar>span{display:block;height:100%;background:var(--accent);border-radius:99px}

.med{display:flex;align-items:center;gap:12px;padding-block:10px;border-top:1px solid var(--line)}
.med:first-of-type{border-top:0}
.check{flex:none;width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg);cursor:pointer;
  display:grid;place-items:center;color:transparent}
.check[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.check svg{width:22px;height:22px}

table{width:100%;border-collapse:collapse;font-size:13px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12px}
th,td{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top}
.scroll{overflow-x:auto}
.empty{text-align:center;color:var(--muted);padding:12px 4px;font-size:14px}
.notice{border-radius:16px;padding:12px 14px;font-size:13px;background:var(--warn-soft);color:var(--warn)}
.notice.alert{background:var(--alert-soft);color:var(--alert)}
.notice.info{background:var(--ok-soft);color:var(--ok)}
.notice b{font-weight:700}
details summary{cursor:pointer;font-family:var(--f-display);font-weight:700;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::after{content:' ＋';color:var(--muted);font-weight:500}
details[open] summary::after{content:' －'}
.adv h3{font-size:13px;color:var(--accent);margin-bottom:2px;letter-spacing:.05em}
.photo{width:100%;aspect-ratio:4/3;max-height:260px;object-fit:cover;border-radius:16px;background:var(--surface2)}
.drop{aspect-ratio:4/3;max-height:220px;border:2px dashed var(--line);border-radius:16px;display:grid;place-items:center;
  text-align:center;color:var(--muted);padding:12px;cursor:pointer;background:var(--bg);width:100%}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.foot{font-size:11px;color:var(--muted);text-align:center;padding-block:12px 8px}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs div{max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;
  color:var(--muted);font-size:11px;cursor:pointer;border-radius:14px;min-height:50px}
.tabs button svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tabs button[aria-current="page"]{color:var(--accent);font-weight:700;background:var(--accent-soft)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13px;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){
  .check{transition:background .15s,transform .15s}.check:active{transform:scale(.9)}
  .bar>span{transition:width .4s}}
</style>
</head>
<body>

<div id="app">
  <header class="top">
    <div><div class="date" id="hdDate"></div><h1 id="hdGreet">こんにちは</h1></div>
    <div class="brand">なんか。</div>
  </header>
  <main><section class="panel" id="view"><div class="card empty">読み込み中…</div></section></main>
  <div class="foot">参考情報です。気になる症状や薬のことは、医師・薬剤師に相談してください。</div>
</div>
<nav class="tabs" aria-label="画面の切り替え"><div id="tabs"></div></nav>
<input type="file" id="photoInput" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
<input type="file" id="importInput" accept="application/json,.json" hidden>
<div id="toast" role="status" hidden></div>
<noscript><p style="padding:16px">このアプリを使うには JavaScript を有効にしてください。</p></noscript>

<script type="module" src="app.js"></script>
</body>
</html>
